<title>Private · Coon Circles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Rubik:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Rubik',sans-serif;font-weight:300;color:#fff;
    background:radial-gradient(120% 120% at 50% 0%,#5d4a2e 0%,#3f3220 55%,#34281a 100%);
    display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
  .gate{width:min(440px,90vw);text-align:center;padding:24px}
  .gate img{height:30px;width:auto;margin-bottom:34px;opacity:.95}
  .eyebrow{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#d5e6d3;margin-bottom:14px}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:34px;line-height:1.15;margin-bottom:14px}
  h1 em{font-style:italic;color:#be5e4f}
  p.sub{font-size:14px;color:rgba(255,255,255,.72);line-height:1.6;margin-bottom:30px}
  form{display:flex;flex-direction:column;gap:12px;align-items:stretch}
  input{font-family:'Rubik',sans-serif;font-size:16px;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:#fff;text-align:center;letter-spacing:.04em;outline:none;transition:border-color .2s}
  input::placeholder{color:rgba(255,255,255,.45)}
  input:focus{border-color:#be5e4f}
  button{font-family:'Rubik',sans-serif;font-size:14px;font-weight:500;letter-spacing:.04em;padding:13px 16px;border:none;border-radius:10px;
    background:#be5e4f;color:#fff;cursor:pointer;transition:transform .15s,background .2s}
  button:hover{background:#a94f41}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.6;cursor:default}
  .err{font-size:13px;color:#f0b3a8;min-height:18px;margin-top:4px}
  .foot{margin-top:34px;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.4)}
</style>

      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},key,b2u(CT));
      var html=new TextDecoder().decode(pt);
      document.open();document.write(html);document.close();
    }catch(err){
      b.disabled=false;b.textContent='Open the circle';
      e.textContent='That passcode didn’t work. Please check and try again.';
      p.select();
    }
  });
})();
